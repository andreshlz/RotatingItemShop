  # ----------------------------------------------------------------------------
  # TIER 4: 10% Chance - Creative-Only Items & Spawn Eggs
  # ----------------------------------------------------------------------------
  creative-items:
    weight: 10
    include-all-spawn-eggs: true
    default-spawn-egg-price: 2500
    rare-spawn-egg-price: 5000
    rare-spawn-egg-keywords:
      - VILLAGER
      - ALLAY
      - SNIFFER
      - WARDEN
      - ENDER_DRAGON
      - WITHER
      - IRON_GOLEM
      - MOOSHROOM
    items:
      - "SPAWNER:1:12000"
