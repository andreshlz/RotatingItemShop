# ==============================================================================
# RotatingItemShop Configuration (Paper 26.3)
# ==============================================================================

timers:
  single-items-seconds: 150   # 2m 30s
  combo-deals-seconds: 300    # 5m 00s
  auto-save-minutes: 5

economy:
  starting-balance: 0
  currency-symbol: "$"
  combo-discount-percent: 50  # 50% off total bundle value

shortcuts:
  sneak-swap-hands-opens-shop: true   # Shift + F opens /shop
  sneak-drop-opens-top3: true         # Shift + Q opens Top 3 Leaderboard

display:
  live-actionbar: true

# ==============================================================================
# Weighted Buy Categories (Must total 100 for exact percentages)
# ==============================================================================
buy-categories:

  # ----------------------------------------------------------------------------
  # TIER 1: 40% Chance - Armor & Tools
  # Format: "MATERIAL:AMOUNT:PRICE"
  # ----------------------------------------------------------------------------
  armor-tools:
    weight: 40
    items:
      - "DIAMOND_HELMET:1:650"
      - "DIAMOND_CHESTPLATE:1:1100"
      - "DIAMOND_LEGGINGS:1:950"
      - "DIAMOND_BOOTS:1:600"
      - "DIAMOND_SWORD:1:600"
      - "DIAMOND_PICKAXE:1:750"
      - "DIAMOND_AXE:1:750"
      - "DIAMOND_SHOVEL:1:450"
      - "NETHERITE_HELMET:1:2400"
      - "NETHERITE_CHESTPLATE:1:3600"
      - "NETHERITE_LEGGINGS:1:3200"
      - "NETHERITE_BOOTS:1:2200"
      - "NETHERITE_SWORD:1:2500"
      - "NETHERITE_PICKAXE:1:2800"
      - "NETHERITE_AXE:1:2800"
      - "BOW:1:350"
      - "CROSSBOW:1:450"
      - "SHIELD:1:250"
      - "TRIDENT:1:3200"
      - "MACE:1:7500"
      - "ELYTRA:1:6500"
      - "DIAMOND_HORSE_ARMOR:1:1500"
      - "NETHERITE_HORSE_ARMOR:1:2000"
      - "DIAMOND_NAUTILUS_ARMOR:1:1500"
      - "NETHERITE_NAUTILUS_ARMOR:1:2000"

  # ----------------------------------------------------------------------------
  # TIER 2: 30% Chance - Potions, Max-Level Enchanted Books & High-Saturation Foods
  # Standard Format: "MATERIAL:AMOUNT:PRICE"
  # Potion Format:   "POTION:POTION_TYPE:MODIFIER:AMOUNT:PRICE"
  #   Modifiers: NORMAL, LONG (extended duration), STRONG (Level II)
  # ----------------------------------------------------------------------------
  consumables-enchants:
    weight: 30
    include-max-enchanted-books: true
    enchanted-book-prices:
      level-1: 1200
      level-2: 1400
      level-3: 1650
      level-4: 1950
      level-5-plus: 2400
    excluded-enchantments:
      - binding_curse
      - vanishing_curse
    items:
      # High-Saturation Foods
      - "GOLDEN_CARROT:16:320"
      - "COOKED_BEEF:32:240"
      - "COOKED_PORKCHOP:32:240"
      - "GOLDEN_APPLE:4:450"
      - "ENCHANTED_GOLDEN_APPLE:1:3500"
      - "SUSPICIOUS_STEW:4:220"
      # Potions
      - "POTION:STRENGTH:STRONG:1:550"
      - "POTION:SWIFTNESS:STRONG:1:400"
      - "POTION:REGENERATION:STRONG:1:600"
      - "POTION:HEALING:STRONG:1:450"
      - "POTION:FIRE_RESISTANCE:LONG:1:500"
      - "POTION:NIGHT_VISION:LONG:1:350"
      - "POTION:INVISIBILITY:LONG:1:500"
      - "POTION:WATER_BREATHING:LONG:1:350"
      - "POTION:SLOW_FALLING:LONG:1:450"
      - "POTION:LEAPING:STRONG:1:400"
      - "POTION:TURTLE_MASTER:STRONG:1:750"

  # ----------------------------------------------------------------------------
  # TIER 3: 20% Chance - Rare Collectibles, Armor Trims, Music Discs & Ore Blocks
  # ----------------------------------------------------------------------------
  rare-collectibles-ores:
    weight: 20
    items:
      # High-Value Ore & Mineral Blocks
      - "DIAMOND_BLOCK:2:1800"
      - "EMERALD_BLOCK:4:1600"
      - "GOLD_BLOCK:4:1100"
      - "IRON_BLOCK:8:900"
      - "NETHERITE_BLOCK:1:7200"
      - "ANCIENT_DEBRIS:2:1600"
      - "DIAMOND_ORE:4:950"
      - "EMERALD_ORE:4:900"
      # Armor Trims & Smithing Templates
      - "NETHERITE_UPGRADE_SMITHING_TEMPLATE:1:2200"
      - "SILENCE_ARMOR_TRIM_SMITHING_TEMPLATE:1:3500"
      - "WARD_ARMOR_TRIM_SMITHING_TEMPLATE:1:2500"
      - "SPIRE_ARMOR_TRIM_SMITHING_TEMPLATE:1:2200"
      - "RIB_ARMOR_TRIM_SMITHING_TEMPLATE:1:1800"
      - "SNOUT_ARMOR_TRIM_SMITHING_TEMPLATE:1:1800"
      - "EYE_ARMOR_TRIM_SMITHING_TEMPLATE:1:1800"
      - "VEX_ARMOR_TRIM_SMITHING_TEMPLATE:1:2000"
      - "TIDE_ARMOR_TRIM_SMITHING_TEMPLATE:1:1800"
      - "BOLT_ARMOR_TRIM_SMITHING_TEMPLATE:1:1800"
      - "FLOW_ARMOR_TRIM_SMITHING_TEMPLATE:1:1800"
      # Music Discs
      - "MUSIC_DISC_PIGSTEP:1:2400"
