# ==============================================================================
# RotatingItemShop Configuration (Paper 26.3)
# ==============================================================================

# Restock timers in seconds
timers:
  single-items-seconds: 150   # Default: 150s (2m 30s)
  combo-deals-seconds: 300    # Default: 300s (5m 00s)
  auto-save-minutes: 5        # How often balances.yml saves automatically

# Currency & Economy Settings
economy:
  starting-balance: 0
  currency-symbol: "$"
  combo-discount-percent: 50  # 50% off total bundle value

# Keybind Shortcuts
shortcuts:
  sneak-swap-hands-opens-shop: true   # Shift + F opens /shop
  sneak-drop-opens-top3: true         # Shift + Q opens Top 3 Leaderboard

# Buy Rotation Settings
buy-rotation:
  allow-placeable-blocks: false       # Keep false to prevent blocks in buy rotation
  include-spawn-eggs: true
  default-spawn-egg-price: 950
  rare-spawn-egg-price: 2500
  rare-spawn-eggs:
    - VILLAGER_SPAWN_EGG
    - ALLAY_SPAWN_EGG
    - SNIFFER_SPAWN_EGG

  # Max-level Enchanted Book pricing by max enchantment level
  enchanted-book-prices:
    level-1: 1200   # e.g. Mending, Silk Touch, Infinity
    level-2: 1400
    level-3: 1650   # e.g. Fortune III, Unbreaking III, Looting III
    level-4: 1950   # e.g. Protection IV
    level-5-plus: 2400 # e.g. Sharpness V, Efficiency V, Power V

  # Single & Combo Buy Pool (MATERIAL:AMOUNT:PRICE)
  items:
    - "DIAMOND:4:250"
    - "EMERALD:8:200"
    - "NETHERITE_INGOT:1:1800"
    - "NETHERITE_SCRAP:2:750"
    - "GOLDEN_APPLE:4:300"
    - "ENCHANTED_GOLDEN_APPLE:1:3500"
    - "ENDER_PEARL:8:160"
    - "BLAZE_ROD:6:240"
    - "GHAST_TEAR:2:400"
    - "TOTEM_OF_UNDYING:1:2800"
    - "ELYTRA:1:6500"
    - "TRIDENT:1:3200"
    - "HEART_OF_THE_SEA:1:3000"
    - "NETHER_STAR:1:5000"
    - "EXPERIENCE_BOTTLE:32:320"
    - "FIREWORK_ROCKET:32:160"
    - "DIAMOND_SWORD:1:600"
    - "DIAMOND_PICKAXE:1:750"
    - "DIAMOND_CHESTPLATE:1:1100"
    - "NETHERITE_UPGRADE_SMITHING_TEMPLATE:1:2200"
    - "WIND_CHARGE:16:240"
    - "MACE:1:7500"

# Selling Rules & Dynamic Pricing Tiers
selling:
  allow-blocks: true
  block-non-refundable-tag: true

  # Horse & Nautilus Armor Sell Prices ($150 - $1,000)
  # Buy price in shop is automatically 2x these values
  armor-tiers:
    LEATHER: 150
    COPPER: 250
    IRON: 350
    GOLDEN: 500
    DIAMOND: 750
    NETHERITE: 1000

  # Block Sell Price Overrides ($10 - $500)
  blocks:
    default-block-price: 15
    common-blocks-price: 12     # Dirt, Cobblestone, Sand, Stone, Gravel, etc.
    logs-and-wood-price: 22     # All *_LOG, *_WOOD, *_STEM, *_HYPHAE
    flowers-price: 18           # Dandelion, Poppy, Tulips, Orchids, etc.
    decorative-stone-price: 55  # Terracotta, Stone Bricks, Quartz, Prismarine
    obsidian-price: 100         # Obsidian, Crying Obsidian, Gilded Blackstone
    standard-ore-price: 65
    precious-ore-price: 90
    gem-ore-price: 150          # Diamond & Emerald Ore
    specific:
      BEACON: 500
      NETHERITE_BLOCK: 500
      ANCIENT_DEBRIS: 450
      DIAMOND_BLOCK: 400
      EMERALD_BLOCK: 350
      GOLD_BLOCK: 250
      IRON_BLOCK: 180
      LAPIS_BLOCK: 120
      REDSTONE_BLOCK: 120
      COPPER_BLOCK: 120

  # Standard Item Sell Prices ($5 - $2,500+)
  items:
    default-item-price: 8
    crops-and-seeds-price: 5
    specific:
      NETHER_STAR: 2500
      HEART_OF_THE_SEA: 2500
      ELYTRA: 2200
      TOTEM_OF_UNDYING: 1200
      NETHERITE_INGOT: 950
      TRIDENT: 900
      ENCHANTED_GOLDEN_APPLE: 850
      NETHERITE_SCRAP: 350
      DIAMOND: 150
      EMERALD: 110
      GHAST_TEAR: 75
      BLAZE_ROD: 75
      PHANTOM_MEMBRANE: 75
      GOLD_INGOT: 55
      ENDER_PEARL: 55
      GOLDEN_APPLE: 55
      IRON_INGOT: 30
      COPPER_INGOT: 30
      SLIME_BALL: 30
      MAGMA_CREAM: 30
      COAL: 18
      QUARTZ: 18
      AMETHYST_SHARD: 18
      GLOWSTONE_DUST: 18
      REDSTONE: 18
      LAPIS_LAZULI: 18
      BONE: 10
      STRING: 10
      GUNPOWDER: 10
      SPIDER_EYE: 10
      ROTTEN_FLESH: 10
